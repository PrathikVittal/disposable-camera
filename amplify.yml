version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify env vars are only available at build time.
        # Write them to .env.production so Prisma + Next.js can
        # read them at runtime (SSR / API routes).
        - |
          printenv | grep -E '^(DATABASE_URL|DIRECT_URL|AUTH_SECRET|AUTH_GOOGLE_ID|AUTH_GOOGLE_SECRET|REGION|ACCESS_KEY_ID|SECRET_ACCESS_KEY|S3_BUCKET_NAME|CLOUDFRONT_DOMAIN)=' > .env.production
        - npx prisma generate
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
